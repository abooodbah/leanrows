[workspace]
members = [
    "crates/leanrows-app",
    "crates/leanrows-core",
    "crates/leanrows-spike",
    "crates/leanrows-win32",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/abooodbah/leanrows"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
