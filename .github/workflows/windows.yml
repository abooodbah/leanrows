name: Windows quality and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality-and-package:
    name: Quality gates and Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          rustc +1.97.1 --version --verbose
          cargo +1.97.1 --version

      - name: Validate release-engineering contracts
        shell: pwsh
        run: ./scripts/Test-ReleaseEngineering.ps1

      - name: Resolve and validate the release version
        shell: pwsh
        run: |
          $version = & ./scripts/Get-WorkspaceVersion.ps1
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag '${{ github.ref_name }}' does not match workspace version '$version'."
          }
          "LEANROWS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fetch locked dependencies
        run: cargo +1.97.1 fetch --locked

      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Run workspace tests
        run: cargo +1.97.1 test --workspace --all-targets --locked

      - name: Run strict Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate the product site
        run: node ./site/validate.mjs

      - name: Build the release application and architecture probe
        run: cargo +1.97.1 build --release --locked -p leanrows-app -p leanrows-spike

      - name: Smoke-test native control creation
        shell: pwsh
        run: |
          ./tests/qa/Invoke-LeanRowsShellSmoke.ps1 `
            -BinaryPath ./target/release/leanrows.exe

      - name: Run reduced fail-closed CI QA
        shell: pwsh
        run: |
          ./tests/qa/Invoke-LeanRowsReleaseQa.ps1 `
            -BinaryPath ./target/release/leanrows.exe `
            -SpikeBinaryPath ./target/release/leanrows-spike.exe `
            -EvidenceDirectory ./artifacts/ci-qa `
            -RandomSeekRuns 12 `
            -SkipSparseScaleFixtures

      - name: Require reduced CI QA evidence
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ./artifacts/ci-qa/qa-receipt.json -PathType Leaf)) {
            throw 'Reduced CI QA did not produce qa-receipt.json.'
          }

      - name: Upload reduced CI QA evidence
        if: ${{ always() && hashFiles('artifacts/ci-qa/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leanrows-ci-qa-evidence
          path: artifacts/ci-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Exercise deterministic packaging and package validation
        shell: pwsh
        run: ./scripts/Test-ReleaseEngineering.ps1 -BinaryPath ./target/release/leanrows.exe

      - name: Create the portable release artifact
        shell: pwsh
        run: |
          ./scripts/Package-Windows.ps1 `
            -BinaryPath ./target/release/leanrows.exe `
            -Version $env:LEANROWS_VERSION `
            -OutputDirectory ./artifacts

      - name: Verify the final checksum contract
        shell: pwsh
        run: ./scripts/Test-ReleaseEngineering.ps1 -ArtifactDirectory ./artifacts

      - name: Upload the unsigned portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leanrows-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality-and-package
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leanrows-windows-x64
          path: artifacts

      - name: Require the exact release artifact set
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath ./artifacts -File)
          $zip = @($files | Where-Object Extension -eq '.zip')
          $checksum = @($files | Where-Object Extension -eq '.sha256')
          if ($files.Count -ne 2 -or $zip.Count -ne 1 -or $checksum.Count -ne 1) {
            throw 'Expected exactly one ZIP and one SHA-256 file.'
          }

      - name: Publish the existing v* tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            ./artifacts/*.zip `
            ./artifacts/*.sha256 `
            --verify-tag `
            --title "LeanRows ${{ github.ref_name }}" `
            --notes-file ./docs/releases/v0.1.2.md

  deploy-pages:
    name: Deploy the verified product page
    if: startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: leanrows-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the tagged site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the tagged product site
        run: node ./site/validate.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the product site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
