name: GitHub Pages deployment

on:
  push:
    branches:
      - main
    paths:
      # Everything the published site is built from. The upload step takes
      # ./site wholesale, so any change under it must redeploy. Without this
      # the live page silently lags main: it only ever showed whatever was
      # last dispatched by hand.
      - 'site/**'
      # The deployment definition itself, so a correction to this workflow
      # deploys under its own new rules.
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leanrows-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the current product page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the product site
        run: node ./site/validate.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload the product site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
